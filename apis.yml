aid: bigchange
url: https://raw.githubusercontent.com/api-evangelist/bigchange/refs/heads/main/apis.yml
name: BigChange
kind: company
description: BigChange is an all-in-one field service and job management platform
  (CRM, job scheduling, live tracking, a mobile workforce app, job finance, and
  business intelligence) known as JobWatch. Its modern REST API - the BigChange DX
  API at https://api.bigchange.com - lets developers manage jobs, contacts and
  persons, quotes, invoices and purchase orders, stock, resources, users and
  vehicles, worksheets, and assets, plus subscribe to webhooks. Requests are
  authenticated with a Bearer JWT access token (obtained through BigChange's
  authentication proxy from a developer-portal API key) and scoped with a required
  Customer-Id header.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
