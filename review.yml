  endpointsModeled:
    - note: >-
        Request and response BODY schemas in the bundled OpenAPI are modeled as
        generic objects rather than reproduced field-by-field; the authoritative
        field-level models live in BigChange's published swagger.json documents.
    - note: >-
        The exact authentication-proxy token endpoint and grant type are modeled
        from the developer-portal navigation (the prose page is JS-rendered and did
        not scrape). Probes showed https://api.bigchange.com/connect/token and
        /oauth/token returning 401 (exist, auth required) - not asserted as the
        canonical token URL.
sources:
  - url: https://api.bigchange.com/swagger/v1/swagger.json
    type: OpenAPI
    note: BigChange DX spec - 108 paths, server https://api.bigchange.com, bearer JWT, required Customer-Id header. All REST, no WebSocket.
  - url: https://api.bigchange.com/swagger/asset-management/v1/swagger.json
    type: OpenAPI
    note: Asset Management spec - 34 paths under /asset-management/v1, same host and bearer scheme.
  - url: https://api.bigchange.com/swagger/webhooks/v1/swagger.json
    type: OpenAPI
    note: Webhooks spec - 4 paths under /webhooks/v1 (subscriptions + failed-delivery retry). Outbound HTTP, not WebSocket.
  - url: https://developers.bigchange.com/docs/rest/api-reference
    type: Documentation
    note: Developer portal REST API reference (JavaScript SPA). Endpoint slugs enumerated via sitemap.xml.
  - url: https://www.bigchange.com/rest-api
    type: Documentation
    note: BigChange REST API marketing page - free "Essentials" tier covering ~90% of typical usage, secure API key management.
  - url: https://community.cyclr.com/connector-guides/bigchange-jobwatch/bigchange-jobwatch-setup
    type: Documentation
    note: Confirms the legacy JobWatch API is authenticated with API key + account username + password.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. BigChange's public API is request/response
    REST across three published OpenAPI documents, with outbound webhooks for
    events. No AsyncAPI document was created because there is no server-push
    WebSocket transport to model.
