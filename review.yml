aid: bigchange
name: BigChange
review:
  question: Does BigChange expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. BigChange's public API surface is
    request/response REST over HTTPS (the BigChange DX, Asset Management, and
    Webhooks APIs, all on https://api.bigchange.com). The only event mechanism is
    outbound webhooks - server-to-consumer HTTP POST callbacks managed via
    /webhooks/v1/subscriptions - which is not a server-push streaming transport
    over a persistent socket. No WebSocket (ws:// or wss://) endpoint is documented
    or present in any of BigChange's three published OpenAPI documents, so there is
    no bidirectional/streaming surface to model with AsyncAPI.
findings:
  summary: |
    BigChange does not publish a documented public WebSocket API. BigChange (the
    JobWatch field service / job management platform) exposes a modern REST API -
    "BigChange DX" - at base URL https://api.bigchange.com. This was verified
    directly against BigChange's own publicly reachable Swagger/OpenAPI documents:
    the DX spec (108 paths), an Asset Management spec (34 paths), and a Webhooks
    spec (4 paths). All three declare a single server (https://api.bigchange.com),
    an HTTP Bearer JWT security scheme, and a required Customer-Id header. The API
    is pure request/response REST; asynchronous delivery is via outbound HTTP
    webhooks, not WebSockets.
  accessModel: |
    Authentication is HTTP Bearer JWT ("Enter the access token only" per the
    published security scheme) plus a required Customer-Id header (int64) on every
    operation. Access tokens are obtained through BigChange's authentication proxy
    using an API key issued in the developer portal (Account > Manage API Keys /
    Integrations). The exact token-exchange endpoint/grant is documented on a
    JavaScript-rendered portal page that did not scrape and is therefore modeled,
    not quoted. A separate legacy JobWatch web-services API (host
    webservice.bigchange.com, API key + account username/password) also exists.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.bigchange.com
      documented: true
      note: BigChange DX (/v1), Asset Management (/asset-management/v1), and Webhooks (/webhooks/v1) APIs. Confirmed from published swagger.json documents.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound HTTP POST callbacks; subscriptions and failed-delivery retries managed under /webhooks/v1. Server-to-consumer HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint appears in any of BigChange's three published OpenAPI documents as of the review date.
  endpointsConfirmedRest:
