meters:
- name: user_seats
  description: Licensed users (mobile workforce and office/back-office users) on the platform.
  unit: users
  aggregation: max
  dimensions:
  - account
  - user_type
- name: tracked_vehicles
  description: Vehicles tracked on the platform, a per-vehicle subscription driver.
  unit: vehicles
  aggregation: max
  dimensions:
  - account
- name: api_usage
  description: REST API request volume; free within the Essentials tier, higher usage on paid/enterprise terms.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
principles:
- name: Visibility
  description: Track licensed user seats and tracked-vehicle counts, and monitor whether API usage stays within the free Essentials allowance.
- name: Allocation
  description: Map seats, vehicles, and API integrations to the teams/depots that use them so platform cost maps to cost centers.
- name: Optimization
  description: Right-size seat and vehicle counts at renewal; replace polling with webhooks to keep API usage inside the free tier and reduce load.
- name: Accountability
  description: Assign an owner for the BigChange contract; review seat/vehicle counts and API tier headroom before each annual renewal.
