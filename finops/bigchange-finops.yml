description: >-
  FinOps view of BigChange spend. BigChange is a SaaS platform billed primarily as a
  per-user (mobile workforce / office user) and per-vehicle subscription, typically
  on an annual contract with one-off implementation and training. REST API access is
  an entitlement of that subscription: a free "Essentials" API tier covers the
  majority of typical usage, with higher usage available on paid/enterprise terms.
  The dominant, recurring cost driver is therefore seat and vehicle count rather than
  metered API calls. All amounts are unreconciled - BigChange list pricing is
  quote-based.
notes: >-
  Because API usage is bundled into the platform subscription rather than metered per
  call, API cost optimization is really subscription optimization: right-size the
  number of users and tracked vehicles, and reduce polling by using webhooks.
  Reconcile per-seat / per-vehicle rates and the API tier boundary with BigChange
  sales.
