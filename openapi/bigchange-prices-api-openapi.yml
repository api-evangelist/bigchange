openapi: 3.2.0
info:
  title: BigChange DX Prices API
  description: Developer Experience API
  version: '1.0'
servers:
- url: https://api.bigchange.com
security:
- bearer: []
tags:
- name: Prices
paths:
  /v1/contacts/{contactId}/prices/{entityType}/{entityId}:
    get:
      tags:
      - Prices
      summary: Get an entity price at contact level
      description: Retrieve the price for a given compound key based on entity type and entity ID at contact level
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: contactId
        in: path
        description: Gets or sets the unique identifier of the contact
        required: true
        schema:
          maximum: 9223372036854776000
          minimum: 1
          type: integer
          format: int64
      - name: entityType
        in: path
        description: Gets or sets the entity type
        required: true
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      - name: entityId
        in: path
        description: Gets or sets the unique identifier of the entity
        required: true
        schema:
          maximum: 9223372036854776000
          minimum: 0
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadPriceModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1ContactsByContactIdPricesByEntityTypeByEntityId
      x-operation-id-source: derived
components:
  schemas:
    HttpValidationProblemDetails:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference [RFC3986] that identifies the problem type
          example: https://example.com/probs/out-of-credit
        title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the problem type
          example: You do not have enough credit
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status code([RFC7231], Section 6) generated by the origin server for this occurrence of the problem
          format: int32
          example: 403
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem
          example: Your current balance is 30, but that costs 50
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem
          example: /account/12345/msgs/abc
      additionalProperties: {}
    ReadPriceModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the price
          format: int32
          example: 5514123
        customerId:
          type: integer
          description: The unique identifier of the customer
          format: int32
          example: 5514123
        contactId:
          type: integer
          description: The unique identifier of the contact
          format: int32
          example: 5514123
        contactReference:
          type: string
          description: The internal reference of the contact
          example: '5514123'
        entityId:
          type: integer
          description: The unique identifier of the entity related to this price
          format: int32
          example: 5514123
        entityType:
          type: integer
          description: The type of entity related to this price
          format: int32
          example: 2
        percentage:
          type:
          - number
          - 'null'
          description: The discount percentage - if available
          format: double
          example: 10
        sellingPrice:
          type:
          - number
          - 'null'
          description: The selling price - if available
          format: double
          example: 70
        currency:
          type:
          - string
          - 'null'
          description: The currency used for this price
          example: EUR
        creationDate:
          type: string
          description: The creation date of the price
          format: date-time
          example: '2022-11-29T16:50:16.0000000+00:00'
        ownerId:
          type: integer
          description: The unique identifier of the last editing user
          format: int32
          example: 5514123
      additionalProperties: false
      description: Represents a model for reading price at contact
  securitySchemes:
    bearer:
      type: http
      description: Enter the access token only.
      scheme: bearer
      bearerFormat: JWT
