  /v1/contacts/{contactId}/attachments:
    get:
      tags:
      - Contacts
      summary: Get a list of attachments for a contact
      description: Retrieve a paged collection of attachments belonging to a contact (required scope attachments:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: contactId
        in: path
        description: The unique identifier of the contact
        required: true
        schema:
          maximum: 9223372036854776000
          minimum: 1
          type: integer
          format: int64
      - name: folderId
        in: query
        description: Only return attachments within the folder with the given ID. Omit, or supply 0, to return attachments outside of any folder
        schema:
          type: integer
          format: int32
      - name: isResourceVisible
        in: query
        description: Only return attachments that are visible to a resource (mobile field engineer) when true. Omit to return attachments regardless of resource visibility
        schema:
          type: boolean
      - name: sortBy
        in: query
        description: The field to sort items in the page by
        schema:
          $ref: '#/components/schemas/AttachmentSortOptions'
      - name: direction
