        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: contactId
        in: path
        description: The contact id
        required: true
        schema:
          maximum: 9223372036854776000
          minimum: 1
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: The file to upload
                  format: binary
                folderId:
                  type: integer
                  description: The ID of the folder where the attachment should be stored (optional)
                  format: int64
                isResourceVisible:
                  type: boolean
                  description: Whether the attachment should be visible to resources (mobile field engineers)
            encoding:
              file:
                style: form
              folderId:
                style: form
              isResourceVisible:
