components:
  schemas:
    ReadFlagModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the flag
          format: int64
          example: 12345
        name:
          type: string
          description: The name of the flag
          example: Urgent
        description:
          type: string
          description: The description of the flag
          example: This flag indicates urgent items
        color:
          type: string
          description: The color associated with the flag
          example: '#FF0000'
        createdAt:
          type: string
          description: The UTC timestamp of when this flag was created
          format: date-time
          example: '2022-11-29T16:50:16.0000000+00:00'
      additionalProperties: false
      description: Read flag model
    HttpValidationProblemDetails:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    FlagSortOptions:
      enum:
      - name
      - createdAt
      type: string
      description: 'Represents the fields that can be used to sort flags<p>Possible values:</p><ul><li><b>name</b>: The name</li><li><b>createdAt</b>: The description</li></ul>'
      example: name
    SortDirection:
      enum:
      - ascending
      - descending
      type: string
      description: 'Represents the direction in which sorting should be applied<p>Possible values:</p><ul><li><b>ascending</b>: Indicates ascending sorting order</li><li><b>descending</b>: Indicates descending sorting order</li></ul>'
      example: ascending
    ReadVehicleGroupModel:
      type: object
      properties:
        vehicleGroupId:
          type: integer
          description: The unique identifier of the vehicle group
          format: int64
          example: 5514123
        name:
          type: string
          description: The name of the vehicle group
          example: South East Fleet
      additionalProperties: false
      description: Represents a model that holds information about a vehicle group
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference [RFC3986] that identifies the problem type
          example: https://example.com/probs/out-of-credit
        title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the problem type
          example: You do not have enough credit
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status code([RFC7231], Section 6) generated by the origin server for this occurrence of the problem
          format: int32
          example: 403
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem
          example: Your current balance is 30, but that costs 50
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem
          example: /account/12345/msgs/abc
      additionalProperties: {}
    PagedResponseReadVehicleGroupModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadVehicleGroupModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    PagedResponseReadVatCodeModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadVatCodeModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    PagedResponseReadNominalCodeModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadNominalCodeModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    ReadRatePeriodModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the rate period
          format: int64
        rate:
          type: number
          description: The VAT rate
          format: double
        startsAt:
          type: string
          description: The start of the period
          format: date-time
      additionalProperties: false
      description: Read rate period model
    DepartmentCodeSortOptions:
      enum:
      - code
      - description
      type: string
      description: 'Represents the fields that can be used to sort department codes<p>Possible values:</p><ul><li><b>code</b>: The code</li><li><b>description</b>: The description</li></ul>'
      example: code
    NominalCodeSortOptions:
      enum:
      - code
      - description
      type: string
      description: 'Represents the fields that can be used to sort nominal codes<p>Possible values:</p><ul><li><b>code</b>: The code</li><li><b>description</b>: The description</li></ul>'
      example: code
    VatCodeSortOptions:
      enum:
      - code
      - description
      type: string
      description: 'Represents the fields that can be used to sort vat codes<p>Possible values:</p><ul><li><b>code</b>: The code</li><li><b>description</b>: The description</li></ul>'
      example: code
    ReadDepartmentCodeModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the department code
          format: int64
          example: 123456
        code:
          type: string
          description: The department code the identifies departments within the organisation
          example: C1234
        description:
          type: string
          description: Description of the department code
          example: Finance
        createdAt:
          type: string
          description: The date and time when the record was created
          format: date-time
          example: '2021-07-01T00:00:00.0000000+00:00'
      additionalProperties: false
      description: Represents a model for reading department code information
    ReadVatCodeModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the VAT code
          format: int64
          example: 5514123
        code:
          type: string
          description: The VAT code
          example: T01
        rate:
          type: number
          description: The VAT tax rate of the current period
          format: double
        ratePeriods:
          type: array
          items:
            $ref: '#/components/schemas/ReadRatePeriodModel'
          description: The VAT tax rate periods, if applicable
        isDomesticReverseCharged:
          type: boolean
          description: Is domestic reverse-charge applied
        description:
          type: string
          description: Description of the code
          example: Nominal code for roofing work
        endsAt:
          type:
          - string
          - 'null'
          description: The date the VAT code period ends, null if there is no future period
          format: date-time
        createdAt:
          type: string
          description: The UTC timestamp of when this nominal code was created
          format: date-time
          example: '2022-11-29T16:50:16.0000000+00:00'
      additionalProperties: false
      description: Read VAT code model
    PagedResponseReadDepartmentCodeModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadDepartmentCodeModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    PagedResponseReadFlagModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadFlagModel'
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItemCount:
          type: integer
          format: int32
      additionalProperties: false
    FlagEntityType:
      enum:
      - contactNote
      - job
      - defInvoiceItem
      - contactUser
      - salesOpportunity
      - contactNotePriority
      - assetDefect
      - quote
      - proforma
      - invoice
      - purchaseOrder
      - creditNote
      - deliveryNote
      - appPayment
      - salesOrder
