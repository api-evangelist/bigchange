openapi: 3.2.0
info:
  title: BigChange DX Vehicles API
  description: Developer Experience API
  version: '1.0'
servers:
- url: https://api.bigchange.com
security:
- bearer: []
tags:
- name: Vehicles
paths:
  /v1/vehicles:
    get:
      tags:
      - Vehicles
      summary: Get a list of vehicles
      description: Retrieve a paged collection of vehicles (required scope vehicles:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: sortBy
        in: query
        description: The field to sort items in the page by
        schema:
          $ref: '#/components/schemas/VehicleSortOptions'
      - name: direction
        in: query
        description: The direction to apply the sort
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: registration
        in: query
        description: 'Only return vehicles where `registration` matches with the value(s) provided (Max items: 50)'
        schema:
          type: array
          items:
            type: string
      - name: reference
        in: query
        description: 'Only return vehicles where `reference` matches the value(s) provided (Max items: 50)'
        schema:
          type: array
          items:
            type: string
      - name: id
        in: query
        description: 'Only return resources where `id` matches the value(s) provided (Max items: 50)'
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: groupId
        in: query
        description: 'Only return resources where `groupId` matches the value(s) provided (Max items: 50)'
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: includeArchived
        in: query
        description: When true also include archived vehicles
        schema:
          type: boolean
      - name: pageNumber
        in: query
        description: 'The page number being requested (minimum: 1, maximum: 2147483)'
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadVehicleModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1Vehicles
      x-operation-id-source: derived
    post:
      tags:
      - Vehicles
      summary: Create a vehicle
      description: Create a new vehicle (required scope vehicles:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleModel'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseInt64'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: postV1Vehicles
      x-operation-id-source: derived
  /v1/vehicles/{vehicleId}:
    get:
      tags:
      - Vehicles
      summary: Get a vehicle
      description: Retrieve the details of a single vehicle (required scope vehicles:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        description: The unique identifer of the vehicle
        required: true
        schema:
          maximum: 9223372036854776000
          minimum: 1
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadVehicleModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1VehiclesByVehicleId
      x-operation-id-source: derived
    patch:
      tags:
      - Vehicles
      summary: Update a vehicle
      description: Update the details of a single vehicle (required scope vehicles:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleModel'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: patchV1VehiclesByVehicleId
      x-operation-id-source: derived
  /v1/vehicles/{vehicleId}/archive:
    put:
      tags:
      - Vehicles
      summary: Archive a vehicle
      description: Archives a vehicle (required scope vehicles:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: putV1VehiclesByVehicleIdArchive
      x-operation-id-source: derived
  /v1/vehicles/{vehicleId}/checks:
    get:
      tags:
      - Vehicles
      summary: Get a list of vehicle checks
      description: Retrieve a paged collection of checks for a single vehicle (required scope vehicles:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        description: The unique identifier of the vehicle whose checks are retrieved
        required: true
        schema:
          type: integer
          format: int64
      - name: completedFrom
        in: query
        description: Only return checks completed on or after this date
        schema:
          type: string
          format: date-time
      - name: completedTo
        in: query
        description: Only return checks completed on or before this date
        schema:
          type: string
          format: date-time
      - name: pageNumber
        in: query
        description: 'The page number being requested (minimum: 1, maximum: 2147483)'
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadVehicleCheckModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1VehiclesByVehicleIdChecks
      x-operation-id-source: derived
  /v1/vehicles/{vehicleId}/defects:
    get:
      tags:
      - Vehicles
      summary: Get defects for a vehicle
      description: Retrieve a paged collection of defects for a specific vehicle (required scope vehicles:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        description: The unique identifier of the vehicle
        required: true
        schema:
          type: integer
          format: int64
          example: 678
        example: 678
      - name: status
        in: query
        description: Filter by defect status
        schema:
          $ref: '#/components/schemas/DefectStatus'
      - name: reportedFrom
        in: query
        description: Filter defects reported on or after this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.0000000+00:00'
        example: '2024-01-01T00:00:00.0000000+00:00'
      - name: reportedTo
        in: query
        description: Filter defects reported on or before this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date-time
          example: '2024-12-31T00:00:00.0000000+00:00'
        example: '2024-12-31T00:00:00.0000000+00:00'
      - name: page
        in: query
        description: The page number being requested
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
          example: 1
        example: 1
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          example: 20
        example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadVehicleDefectModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1VehiclesByVehicleIdDefects
      x-operation-id-source: derived
  /v1/vehicles/{vehicleId}/unarchive:
    put:
      tags:
      - Vehicles
      summary: Unarchive a vehicle
      description: Restores an archived vehicle (required scope vehicles:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: putV1VehiclesByVehicleIdUnarchive
      x-operation-id-source: derived
components:
  schemas:
    CustomFieldType:
      enum:
      - boolean
      - integer
      - decimal
      - text
      - list
      - statement
      - date
      - note
      - time
      - systemList
      type: string
      description: 'The type of the custom field. New field types may be added in the future, so integrations should be resilient to this<p>Possible values:</p><ul><li><b>boolean</b>: Indicates a boolean field <i>(Example: "false")</i></li><li><b>integer</b>: Indicates an integer numeric field <i>(Example: "1001")</i></li><li><b>decimal</b>: Indicates a floating point numeric field <i>(Example: "1.42")</i></li><li><b>text</b>: Indicates an editable text field <i>(Example: "Purple")</i></li><li><b>list</b>: Indicates a field with a single value from a predefined list of options <i>(Example: "Purple")</i></li><li><b>statement</b>: Indicates a text field that cannot be edited. The value is always equal to the default value <i>(Example: "By signing this you agree to the following...")</i></li><li><b>date</b>: Indicates a date field, which will be represented as an RFC3339 formatted date string. The default value is not supported for this type and will always be null <i>(Example: "2024-01-31")</i></li><li><b>note</b>: Indicates a multiline, editable text field. Lines are seperated with a line feed character <i>(Example: "This is a note.")</i></li><li><b>time</b>: Indicates a time field, formatted as HH:mm. The default value is not supported for this type and will always be null <i>(Example: "10:30")</i></li><li><b>systemList</b>: Indicates the ID of a related resource, vehicle or web user <i>(Example: "228007")</i></li></ul>'
      example: boolean
    HttpValidationProblemDetails:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    CreateVehicleModel:
      required:
      - groupId
      - registration
      - vehicleType
      type: object
      properties:
        groupId:
          type: integer
          description: The unique identifier of the group that the vehicle belongs to
          format: int64
          example: 7927
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        fixedResourceId:
          type:
          - integer
          - 'null'
          description: The unique identifier of the resource who this vehicle is assigned to
          format: int64
          example: 110841
        reference:
          type:
          - string
          - 'null'
          description: The internal reference of the vehicle - should usually be unique
          example: ABC5514123
        registration:
          minLength: 1
          type: string
          description: The registration number of the vehicle
          example: BC24 BIG
        make:
          type:
          - string
          - 'null'
          description: The manufacturer of the vehicle
          example: Ford
        model:
          type:
          - string
          - 'null'
          description: The model of the vehicle
          example: Transit
        registrationYear:
          type:
          - integer
          - 'null'
          description: The year that the vehicle was first registered as new
          format: int32
          example: 2012
        isSchedulable:
          type: boolean
          description: Indicates whether this vehicle can be scheduled jobs
          example: true
        idlingFuelConsumptionRate:
          type:
          - number
          - 'null'
          description: The litre fuel consumption of the vehicle used when idling per minute
          format: double
          example: 0.1
        costPerKm:
          type:
          - number
          - 'null'
          description: The running cost of the vehicle per kilometre, expressed in `costPerKmCurrencyCode`
          format: double
          example: 0.25
        costPerDay:
          type:
          - number
          - 'null'
          description: The running cost of the vehicle per day, expressed in `costPerDayCurrencyCode`
          format: double
          example: 0.25
        costPerKmCurrencyCode:
          $ref: '#/components/schemas/CurrencyWrite'
        costPerDayCurrencyCode:
          $ref: '#/components/schemas/CurrencyWrite'
        odometerUnit:
          $ref: '#/components/schemas/OdometerUnit'
        odometer:
          type:
          - integer
          - 'null'
          description: The latest reading from the vehicles odometer
          format: int32
          example: 51023
        roadSafetyExpiresAt:
          type:
          - string
          - 'null'
          description: The date of when the vehicles road safety test expires (eg. UK MOT test)
          format: date
          example: '2022-11-29'
        roadTaxExpiresAt:
          type:
          - string
          - 'null'
          description: The date of when the vehicles road tax expires
          format: date
          example: '2022-11-29'
        serviceDueAt:
          type:
          - string
          - 'null'
          description: The date of when the vehicles next service is due
          format: date
          example: '2022-11-29'
        insuranceDueAt:
          type:
          - string
          - 'null'
          description: The date of when the vehicles insurance is due for renewal
          format: date
          example: '2022-11-29'
        co2EmissionsGramsPerKm:
          type:
          - integer
          - 'null'
          description: The vehicle co2 emission rate as (grams per km). Mutually exclusive with Co2EmissionsKilogramsPerLitre
          format: int32
          example: 5
        co2EmissionsKilogramsPerLitre:
          type:
          - number
          - 'null'
          description: The vehicle co2 emission rate as (kilograms per litre). Mutually exclusive with Co2EmissionsGramsPerKm
          format: double
          example: 5.5
        customFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomFieldWriteModel'
          description: Custom fields associated with the vehicle
      additionalProperties: false
      description: Model representing the data needed to create a vehicle
    VehicleSortOptions:
      enum:
      - createdAt
      - groupName
      - registration
      type: string
      description: 'Represents the sort options for vehicles<p>Possible values:</p><ul><li><b>createdAt</b>: Sort by created at date</li><li><b>groupName</b>: Sort by vehicle group</li><li><b>registration</b>: Sort by registration</li></ul>'
      example: createdAt
    VehicleType:
      enum:
      - motorcycle
      - car
      - trailer
      - bus
      - emergency
      - goodsLess7_5T
      - goodsMore7_5T
      - busLess12
      type: string
      description: 'Enumeration representing different types of vehicles<p>Possible values:</p><ul><li><b>motorcycle</b>: Motorcycle vehicle type</li><li><b>car</b>: Car vehicle type</li><li><b>trailer</b>: Trailer vehicle type</li><li><b>bus</b>: Bus vehicle type</li><li><b>emergency</b>: Emergency vehicle type</li><li><b>goodsLess7_5T</b>: Goods vehicle type with weight less than 7.5 tons</li><li><b>goodsMore7_5T</b>: Goods vehicle type with weight more than or equal to 7.5 tons</li><li><b>busLess12</b>: Bus vehicle type with less than 12 seats</li></ul>'
      example: motorcycle
    PagedResponseReadVehicleCheckModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadVehicleCheckModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    CustomFieldSystemListType:
      enum:
      - resource
      - vehicle
      - webUser
      type: string
      description: The type of entity used for custom field value of type system list<p>Possible values:</p><ul><li><b>resource</b></li><li><b>vehicle</b></li><li><b>webUser</b></li></ul>
      example: resource
    PagedResponseReadVehicleDefectModel:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadVehicleDefectModel'
          description: The items returned for the requested page
        pageNumber:
          type: integer
          description: The page number of the response where 1 is the first page
          format: int32
          example: 2
        pageSize:
          type: integer
          description: The number of items requested for the current page
          format: int32
          example: 100
        pageItemCount:
          type: integer
          description: The number of items returned in the current page
          format: int32
          readOnly: true
          example: 55
      additionalProperties: false
      description: A paged collection of items
    SortDirection:
      enum:
      - ascending
      - descending
      type: string
      description: 'Represents the direction in which sorting should be applied<p>Possible values:</p><ul><li><b>ascending</b>: Indicates ascending sorting order</li><li><b>descending</b>: Indicates descending sorting order</li></ul>'
      example: ascending
