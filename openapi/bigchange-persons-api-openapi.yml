openapi: 3.2.0
info:
  title: BigChange DX Persons API
  description: Developer Experience API
  version: '1.0'
servers:
- url: https://api.bigchange.com
security:
- bearer: []
tags:
- name: Persons
paths:
  /v1/persons:
    get:
      tags:
      - Persons
      summary: Get a list of persons
      description: Retrieve a paged collection of persons (required scope contacts:persons:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: sortBy
        in: query
        description: The field to sort items in the page by
        schema:
          $ref: '#/components/schemas/PersonSortOptions'
      - name: direction
        in: query
        description: The direction to apply the sort
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: contactId
        in: query
        description: 'Only return persons where `contactId` matches the value(s) provided (Max items: 50)'
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: surname
        in: query
        description: Only return persons where `surname` matches or starts with the value provided
        schema:
          type: string
      - name: email
        in: query
        description: Only return persons where `email` matches the value provided
        schema:
          type: string
      - name: mobile
        in: query
        description: Only return persons where `mobile` matches the value provided
        schema:
          type: string
      - name: landline
        in: query
        description: Only return persons where `landline` matches the value provided
        schema:
          type: string
      - name: isOptedOut
        in: query
        description: Only return persons where `isOptedOut` matches the value provided
        schema:
          type: boolean
      - name: isMain
        in: query
        description: Only return persons where `isMain` matches the value provided
        schema:
          type: boolean
      - name: pageNumber
        in: query
        description: 'The page number being requested (minimum: 1, maximum: 2147483)'
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadPersonModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1Persons
      x-operation-id-source: derived
    post:
      tags:
      - Persons
      summary: Create a person
      description: Create a new person (required scope contacts:persons:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Create person model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseGuid'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: postV1Persons
      x-operation-id-source: derived
  /v1/persons/{personId}:
    get:
      tags:
      - Persons
      summary: Get a person
      description: Retrieve the details of a single person (required scope contacts:persons:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: The unique identifier of the person
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadPersonModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1PersonsByPersonId
      x-operation-id-source: derived
    patch:
      tags:
      - Persons
      summary: Update a person
      description: Update the details of a single person (required scope contacts:persons:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Update person model. At least one optional value must be provided
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonModel'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: patchV1PersonsByPersonId
      x-operation-id-source: derived
    delete:
      tags:
      - Persons
      summary: Delete a person
      description: Soft deletes a person (required scope contacts:persons:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: deleteV1PersonsByPersonId
      x-operation-id-source: derived
  /v1/persons/{personId}/dataConsent:
    put:
      tags:
      - Persons
      summary: Set a person's data consent
      description: Captures information about when a person granted/denied consent to have their personal data stored (required scope contacts:persons:write)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Update person consent model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonConsentModel'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: putV1PersonsByPersonIdDataConsent
      x-operation-id-source: derived
  /v1/persons/{personId}/dataConsent/history:
    get:
      tags:
      - Persons
      summary: Get a person's consent history
      description: Gets a paged collection of events indicating when a person granted/denied consent to have their personal data stored (required scope contacts:persons:read)
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: The unique identifier of the person
        required: true
        schema:
          type: string
          format: uuid
      - name: direction
        in: query
        description: The direction to apply the sort
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: sortBy
        in: query
        description: The field to sort items in the page by
        schema:
          $ref: '#/components/schemas/PersonConsentSortOption'
      - name: pageNumber
        in: query
        description: 'The page number being requested (minimum: 1, maximum: 2147483)'
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadPersonConsentModel'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1PersonsByPersonIdDataConsentHistory
      x-operation-id-source: derived
  /v1/persons/{personId}/flags:
    get:
      tags:
      - Persons
      summary: Retrieve the flags currently applied to a person
      description: 'Retrieve all flags currently applied to a person, ordered newest first.


        **Person flags differ from other entity flag endpoints** (e.g. Purchase Orders, Sales Opportunities): a person can have multiple flags active simultaneously, there is no single "current" flag, and there is no separate history endpoint — this list is the complete current state.


        The `id` values returned are flag type IDs scoped to the `ContactUser` entity type. Use `GET /flags?entityType=ContactUser` (requires the `flags:read` scope) to discover valid flag IDs for this customer. (required scope contacts:persons:read)'
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: The unique identifier of the person
        required: true
        schema:
          type: string
          format: uuid
      - name: pageNumber
        in: query
        description: 'The page number being requested (minimum: 1, maximum: 2147483)'
        schema:
          maximum: 2147483
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'The page size being requested (minimum: 1, maximum: 1000)'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseReadFlagModel'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: getV1PersonsByPersonIdFlags
      x-operation-id-source: derived
    post:
      tags:
      - Persons
      summary: Add a flag to a person
      description: 'Apply a flag to a person.


        **Person flags differ from other entity flag endpoints**: adding a flag does not create a history record — it tags the person with the flag type directly. This operation is **idempotent**: if the flag is already applied the request succeeds with 204 No Content and the person''s flags are unchanged.


        The `flagId` must be a flag type ID configured for the `ContactUser` entity type. Use `GET /flags?entityType=ContactUser` (requires the `flags:read` scope) to find valid flag IDs for this customer. (required scope contacts:persons:write)'
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: The unique identifier of the person
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The model containing the flag information to add
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPersonFlagModel'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: postV1PersonsByPersonIdFlags
      x-operation-id-source: derived
  /v1/persons/{personId}/flags/{flagId}:
    delete:
      tags:
      - Persons
      summary: Remove a flag from a person
      description: 'Remove a flag from a person.


        **Important**: the `flagId` route parameter is the **flag type ID** — the same ID returned by `GET /flags?entityType=ContactUser` (requires the `flags:read` scope) and by `GET /persons/{personId}/flags`. It is **not** a history record ID, unlike the DELETE endpoint on other entity flag controllers (e.g. Purchase Orders, Sales Opportunities).


        Removing a flag is permanent; no history of the removal is retained. (required scope contacts:persons:write)'
      parameters:
      - name: Customer-Id
        in: header
        description: The customer identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: personId
        in: path
        description: The unique identifier of the person
        required: true
        schema:
          type: string
          format: uuid
      - name: flagId
        in: path
        description: The flag type ID to remove (not a history record ID)
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - $ref: '#/components/schemas/HttpValidationProblemDetails'
      operationId: deleteV1PersonsByPersonIdFlagsByFlagId
      x-operation-id-source: derived
components:
  schemas:
    ReadFlagModel:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the flag
          format: int64
          example: 12345
        name:
          type: string
          description: The name of the flag
          example: Urgent
        description:
          type: string
          description: The description of the flag
          example: This flag indicates urgent items
        color:
          type: string
          description: The color associated with the flag
          example: '#FF0000'
        createdAt:
          type: string
          description: The UTC timestamp of when this flag was created
          format: date-time
          example: '2022-11-29T16:50:16.0000000+00:00'
      additionalProperties: false
      description: Read flag model
    UpdatePersonModel:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
          description: 'The person''s title<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: Mr
          x-optional: Omit to retain current value or provide null to unset
        forename:
          type: string
          description: 'The person''s first name<br/><br/>Optional: Omit to retain current value'
          example: David
          x-optional: Omit to retain current value
        surname:
          type: string
          description: 'The person''s second name<br/><br/>Optional: Omit to retain current value'
          example: Smith
          x-optional: Omit to retain current value
        email:
          type: string
          description: 'The email address of the person, provide an empty string to unset.<br/><br/>Optional: Omit to retain current value'
          example: dave.brown@example.com.
          x-optional: Omit to retain current value
        mobile:
          type:
          - string
          - 'null'
          description: 'The mobile telephone number of the person<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: +447812 123112
          x-optional: Omit to retain current value or provide null to unset
        landline:
          type:
          - string
          - 'null'
          description: 'The landline telephone number of the person<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: +441312 112441
          x-optional: Omit to retain current value or provide null to unset
        extension:
          type:
          - string
          - 'null'
          description: 'The landline extension of the person<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: '12'
          x-optional: Omit to retain current value or provide null to unset
        position:
          type:
          - string
          - 'null'
          description: 'The job role that the person holds within the contact<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: Manager
          x-optional: Omit to retain current value or provide null to unset
        department:
          type:
          - string
          - 'null'
          description: 'The department that the person belongs to<br/><br/>Optional: Omit to retain current value or provide null to unset'
          example: Customer service
          x-optional: Omit to retain current value or provide null to unset
        isOptedOut:
          type: boolean
          description: 'A flag indicating if the contact has opted out of marketing communications<br/><br/>Optional: Omit to retain current value'
          example: false
          x-optional: Omit to retain current value
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldWriteModel'
          description: 'Custom fields associated with the person. Omit or use an empty list to retain current values<br/><br/>Optional: Omit to retain current value'
          x-optional: Omit to retain current value
      additionalProperties: false
      description: Update person model. At least one optional value must be provided
    CustomFieldType:
      enum:
      - boolean
      - integer
      - decimal
      - text
      - list
      - statement
      - date
      - note
      - time
      - systemList
      type: string
      description: 'The type of the custom field. New field types may be added in the future, so integrations should be resilient to this<p>Possible values:</p><ul><li><b>boolean</b>: Indicates a boolean field <i>(Example: "false")</i></li><li><b>integer</b>: Indicates an integer numeric field <i>(Example: "1001")</i></li><li><b>decimal</b>: Indicates a floating point numeric field <i>(Example: "1.42")</i></li><li><b>text</b>: Indicates an editable text field <i>(Example: "Purple")</i></li><li><b>list</b>: Indicates a field with a single value from a predefined list of options <i>(Example: "Purple")</i></li><li><b>statement</b>: Indicates a text field that cannot be edited. The value is always equal to the default value <i>(Example: "By signing this you agree to the following...")</i></li><li><b>date</b>: Indicates a date field, which will be represented as an RFC3339 formatted date string. The default value is not supported for this type and will always be null <i>(Example: "2024-01-31")</i></li><li><b>note</b>: Indicates a multiline, editable text field. Lines are seperated with a line feed character <i>(Example: "This is a note.")</i></li><li><b>time</b>: Indicates a time field, formatted as HH:mm. The default value is not supported for this type and will always be null <i>(Example: "10:30")</i></li><li><b>systemList</b>: Indicates the ID of a related resource, vehicle or web user <i>(Example: "228007")</i></li></ul>'
      example: boolean
    HttpValidationProblemDetails:
      type: object
      allOf:
