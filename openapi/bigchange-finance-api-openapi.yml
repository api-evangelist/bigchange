openapi: 3.2.0
info:
  title: BigChange DX REST Finance API
  version: '1.0'
  description: OpenAPI description of the BigChange DX REST API (the modern REST interface to the BigChange / JobWatch field service and job management platform).
  contact:
    name: BigChange Developer Portal
    url: https://developers.bigchange.com/docs/rest/api-reference
servers:
- url: https://api.bigchange.com
  description: BigChange DX production API (all products share this host)
security:
- bearer: []
tags:
- name: Finance
paths:
  /v1/finance/invoices:
    get:
      tags:
      - Finance
      summary: Get a list of invoices
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: A paged list of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
      operationId: getV1FinanceInvoices
      x-operation-id-source: derived
    post:
      tags:
      - Finance
      summary: Create an invoice
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          description: The created invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
      operationId: postV1FinanceInvoices
      x-operation-id-source: derived
  /v1/finance/quotes:
    get:
      tags:
      - Finance
      summary: Get a list of quotes
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: A paged list of quotes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
      operationId: getV1FinanceQuotes
      x-operation-id-source: derived
    post:
      tags:
      - Finance
      summary: Create a quote
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          description: The created quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
      operationId: postV1FinanceQuotes
      x-operation-id-source: derived
  /v1/finance/purchaseOrders:
    get:
      tags:
      - Finance
      summary: Get a list of purchase orders
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: A paged list of purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
      operationId: getV1FinancePurchaseOrders
      x-operation-id-source: derived
components:
  parameters:
    CustomerId:
      name: Customer-Id
      in: header
      required: true
      description: The customer (BigChange account) identifier. Required on every operation in the published spec.
      schema:
        type: integer
        format: int64
  schemas:
    GenericArray:
      type: array
      items:
        $ref: '#/components/schemas/GenericObject'
    GenericObject:
      type: object
      description: Placeholder object. See BigChange's published swagger.json for the full, authoritative field-level schema of this resource.
      additionalProperties: true
    PagedResult:
      type: object
      description: Standard paged list envelope (modeled).
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        items:
          $ref: '#/components/schemas/GenericArray'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JWT access token. Obtain an access token from BigChange''s authentication proxy using an API key issued in the developer portal (Account > Manage API Keys / Integrations), then send it as `Authorization: Bearer <access_token>`. Confirmed from the published BigChange swagger security scheme ("Enter the access token only").'
